version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: routemate-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ROUTEMATE_ENV=${ROUTEMATE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET:-routemate_production_secret_key_2026_secure_jwt}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:80,https://adarshbandaru.github.io}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_routemate_sandbox}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-routemate_rzp_secret_test_2026}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-routemate_rzp_webhook_secret_2026}
      - RAZORPAY_SANDBOX_MODE=${RAZORPAY_SANDBOX_MODE:-true}
    volumes:
      - routemate-data:/app/backend
    networks:
      - routemate-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: routemate-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - routemate-net
    restart: unless-stopped

volumes:
  routemate-data:
    driver: local

networks:
  routemate-net:
    driver: bridge
