[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "routemate"
version = "0.1.0"
description = "Small, interpretable simulated journey compatibility prototype"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.104.1",
  "uvicorn>=0.24.0",
  "pyjwt>=2.8.0",
  "python-socketio>=5.17.0",
  "httpx>=0.25.0,<0.28.0",
]

[project.scripts]
routemate-demo = "routemate.cli:main"
routemate-api = "routemate.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
