[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "routemate"
version = "0.1.0"
description = "Small, interpretable simulated journey compatibility prototype"
requires-python = ">=3.9"

[project.scripts]
routemate-demo = "routemate.cli:main"
routemate-api = "routemate.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
